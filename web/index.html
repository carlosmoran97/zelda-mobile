<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10221d">
  <meta name="description" content="Zelda Mobile, restored in Rust. Play the original adventure in your browser with touch controls.">
  <title>Zelda Mobile · Play</title>
  <link rel="icon" href="./icon.png" type="image/png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="handheld" aria-label="Zelda Mobile game">
    <header class="topbar">
      <span class="brand"><span class="triforce" aria-hidden="true">▲</span> ZELDA <span>MOBILE</span></span>
      <button id="sound" class="utility" aria-label="Enable sound" aria-pressed="false">Sound off</button>
    </header>
    <section class="stage" aria-label="Game screen">
      <div class="screen">
        <canvas id="game" width="240" height="320" aria-label="Zelda Mobile game display"></canvas>
        <div id="overlay" class="overlay">
          <span class="crest" aria-hidden="true">▲</span>
          <h1 id="overlay-title">Zelda Mobile</h1>
          <p id="overlay-text" role="status">Loading your adventure…</p>
          <button id="resume" class="start" hidden>Play</button>
        </div>
      </div>
    </section>
    <section class="control-deck" aria-label="Touch controls">
      <div class="commands">
        <button data-action="7" id="command-left" class="command" disabled>Left command</button>
        <button data-action="6" class="menu" aria-label="Inventory and game menu">MENU</button>
        <button data-action="8" id="command-right" class="command" disabled>Right command</button>
      </div>
      <div class="play-controls">
        <div class="dpad" aria-label="Directional pad">
          <button data-action="0" class="direction up" aria-label="Move up"><span aria-hidden="true">▲</span></button>
          <button data-action="2" class="direction left" aria-label="Move left"><span aria-hidden="true">◀</span></button>
          <span class="pad-center" aria-hidden="true">◆</span>
          <button data-action="3" class="direction right" aria-label="Move right"><span aria-hidden="true">▶</span></button>
          <button data-action="1" class="direction down" aria-label="Move down"><span aria-hidden="true">▼</span></button>
        </div>
        <div class="action-buttons">
          <button data-action="5" class="action secondary" aria-label="B: secondary action and back">B</button>
          <button data-action="4" class="action primary" aria-label="A: primary action and confirm">A</button>
          <span class="action-caption" aria-hidden="true">ADVENTURE AWAITS</span>
        </div>
      </div>
    </section>
    <footer><span id="status" role="status">Rust + WebAssembly</span><a href="./credits.html">Credits</a></footer>
  </main>
  <aside id="notice" role="alert" hidden><span id="notice-text"></span><button id="dismiss" aria-label="Dismiss notice">×</button></aside>
  <script type="module" src="./app.js"></script>
</body>
</html>
