[package]
name = "zelda-mobile"
version = "0.1.0"
edition = "2024"
description = "Native Rust restoration of Zelda Mobile beta 4"

[dependencies]
sdl3 = { version = "0.22.1", features = ["build-from-source-static"] }
image = { version = "0.25", default-features = false, features = ["png"] }
fontdue = "0.9"
rustysynth = "1.3"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
debug = 1

[profile.dev]
debug = 0

